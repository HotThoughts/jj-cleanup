[workspace]
members = ["cargo:."]

# Config for 'dist'
[dist]
# The preferred dist version to use in CI (Cargo.toml SemVer syntax)
cargo-dist-version = "0.32.0"
# CI backends to support
ci = "github"
# The installers to generate for each app
installers = ["shell"]
# Target platforms to build apps for (Rust target-triple syntax)
targets = ["aarch64-apple-darwin", "aarch64-unknown-linux-gnu", "x86_64-apple-darwin", "x86_64-unknown-linux-gnu", "x86_64-pc-windows-msvc"]
# Where to host releases
hosting = "github"
# .github/workflows/release.yml is hand-tuned (pinned action SHAs, least-privilege permissions,
# ubuntu-slim runners), so `dist plan` must not diff it against the generated template, and
# `dist generate` must not overwrite it. The rest of the config is still validated by `dist plan`.
allow-dirty = ["ci"]
