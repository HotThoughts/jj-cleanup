# Dependency policy: permissive licenses only, and nothing from outside crates.io.
#
# `cargo deny check` runs this in CI.

[licenses]
version = 2
# A dual-licensed crate satisfies this list through either branch, which is how the Rust
# ecosystem's `MIT OR Apache-2.0` default passes with the two entries below.
allow = [
    "MIT",
    "Apache-2.0",
    "Unicode-3.0",
    "BSD-3-Clause",
]
confidence-threshold = 0.93

[bans]
wildcards = "deny"
multiple-versions = "warn"

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
